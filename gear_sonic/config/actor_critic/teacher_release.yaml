# @package _global_
# Frozen SONIC release teacher used by the standalone DAgger trainer.

defaults:
  - quantizers/fsq@algo.config.teacher_actor.backbone.quantizer

algo:
  config:
    teacher_actor:
      _target_: gear_sonic.trl.modules.actor_critic_modules.Actor
      running_mean_std: false
      input_obs_dict: true
      has_aux_loss: false
      backbone:
        _target_: gear_sonic.trl.modules.universal_token_modules.UniversalTokenModule
        num_future_frames: ${manager_env.commands.motion.num_future_frames}
        proprioception_features: ["teacher"]
        encoder_sample_probs: ${manager_env.commands.motion.encoder_sample_probs}
        num_fsq_levels: 32
        fsq_level_list: 32
        max_num_tokens: 2
        encoders:
          g1:
            inputs:
              [
                "command_multi_future_nonflat",
                "motion_anchor_ori_b_mf_nonflat",
                "command_z_multi_future_nonflat",
              ]
            params:
              _target_: gear_sonic.trl.modules.base_module.BaseModule
              input_dim:
              output_dim:
              num_input_temporal_dims: ${manager_env.commands.motion.num_future_frames}
              num_output_temporal_dims: 2
              module_config_dict:
                layer_config:
                  type: MLP
                  hidden_dims: [2048, 1024, 512, 512]
                  activation: SiLU
          teleop:
            inputs:
              [
                "command_multi_future_lower_body",
                "vr_3point_local_target",
                "vr_3point_local_orn_target",
                "motion_anchor_ori_b",
                "command_z",
              ]
            params:
              _target_: gear_sonic.trl.modules.base_module.BaseModule
              input_dim:
              output_dim:
              num_input_temporal_dims:
              num_output_temporal_dims: 2
              module_config_dict:
                layer_config:
                  type: MLP
                  hidden_dims: [2048, 1024, 512, 512]
                  activation: SiLU
          smpl:
            inputs: ["smpl_joints_multi_future_nonflat", "smpl_root_ori_b_multi_future"]
            params:
              _target_: gear_sonic.trl.modules.base_module.BaseModule
              input_dim:
              output_dim:
              num_input_temporal_dims: ${manager_env.commands.motion.smpl_num_future_frames}
              num_output_temporal_dims: 2
              module_config_dict:
                layer_config:
                  type: MLP
                  hidden_dims: [2048, 1024, 512, 512]
                  activation: SiLU
        decoders:
          g1_dyn:
            inputs: ["token_flattened", "proprioception"]
            outputs: ["action"]
            has_temporal_dim: false
            params:
              _target_: gear_sonic.trl.modules.base_module.BaseModule
              input_dim:
              output_dim:
              num_input_temporal_dims:
              num_output_temporal_dims:
              module_config_dict:
                layer_config:
                  type: MLP
                  hidden_dims: [2048, 2048, 1024, 1024, 512, 512]
                  activation: SiLU
          g1_kin:
            outputs:
              [
                "command_multi_future_nonflat",
                "motion_anchor_ori_b_mf_nonflat",
                "command_z_multi_future_nonflat",
              ]
            inputs: ["token"]
            has_temporal_dim: true
            params:
              _target_: gear_sonic.trl.modules.base_module.BaseModule
              input_dim:
              output_dim:
              num_input_temporal_dims: 2
              num_output_temporal_dims: ${manager_env.commands.motion.num_future_frames}
              module_config_dict:
                layer_config:
                  type: MLP
                  hidden_dims: [2048, 1024, 512, 512]
                  activation: SiLU
