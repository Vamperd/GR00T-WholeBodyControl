# Plain-MLP student observations for the SONIC release G1 teacher.
#
# The student receives the same G1 reference features used by the release
# universal-token encoder, together with the proprioceptive/action history
# used by the release policy.  The group is flattened into ``actor_obs`` by
# ManagerEnvWrapper and is the only input consumed by the student MLP.

defaults:
  - ../terms/gravity_dir@_here_
  - ../terms/base_ang_vel@_here_
  - ../terms/joint_pos@_here_
  - ../terms/joint_vel@_here_
  - ../terms/actions@_here_

_target_: gear_sonic.envs.manager_env.mdp.observations.PolicyCfg
enable_corruption: false
concatenate_terms: true

gravity_dir:
  history_length: ${actor_prop_history_length}

base_ang_vel:
  history_length: ${actor_prop_history_length}

joint_pos:
  history_length: ${actor_prop_history_length}

joint_vel:
  history_length: ${actor_prop_history_length}

actions:
  history_length: ${actor_actions_history_length}

# PolicyCfg exposes the flattened names below; the release tokenizer keeps
# separate non-flat aliases for its universal-token input.
command_multi_future:
  _target_: isaaclab.managers.ObservationTermCfg
  func: gear_sonic.envs.manager_env.mdp:command_multi_future
  params:
    command_name: "motion"
    non_flatten: false

command_z_multi_future:
  _target_: isaaclab.managers.ObservationTermCfg
  func: gear_sonic.envs.manager_env.mdp:command_z_multi_future
  params:
    command_name: "motion"
    non_flatten: false

motion_anchor_ori_b_mf:
  _target_: isaaclab.managers.ObservationTermCfg
  func: gear_sonic.envs.manager_env.mdp:motion_anchor_ori_b_mf
  params:
    command_name: "motion"
    non_flatten: false
