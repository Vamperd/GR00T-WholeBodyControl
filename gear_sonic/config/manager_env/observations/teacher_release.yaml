# Original release-policy proprioception presented under the ``teacher`` key.
# The student receives a larger G1-reference actor_obs group; the frozen
# universal-token teacher must keep its original proprioceptive input contract.

defaults:
  - ../terms/gravity_dir@_here_
  - ../terms/base_ang_vel@_here_
  - ../terms/joint_pos@_here_
  - ../terms/joint_vel@_here_
  - ../terms/actions@_here_

_target_: gear_sonic.envs.manager_env.mdp.observations.TeacherCfg
enable_corruption: false
concatenate_terms: true

gravity_dir:
  history_length: ${actor_prop_history_length}

base_ang_vel:
  history_length: ${actor_prop_history_length}

joint_pos:
  history_length: ${actor_prop_history_length}

joint_vel:
  history_length: ${actor_prop_history_length}

actions:
  history_length: ${actor_actions_history_length}
